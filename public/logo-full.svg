<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1600 480' width='1600' height='480'>
  <defs>
    <linearGradient id='gradBack' x1='15%' y1='15%' x2='85%' y2='85%'>
      <stop offset='0%' stop-color='#00d2ff' />
      <stop offset='45%' stop-color='#2563eb' />
      <stop offset='100%' stop-color='#7c3aed' />
    </linearGradient>

    <linearGradient id='gradFront' x1='15%' y1='85%' x2='85%' y2='15%'>
      <stop offset='0%' stop-color='#00d2ff' />
      <stop offset='42%' stop-color='#2563eb' />
      <stop offset='78%' stop-color='#6366f1' />
      <stop offset='100%' stop-color='#8b5cf6' />
    </linearGradient>

    <filter id='overlapShadow' x='-20%' y='-20%' width='150%' height='150%'>
      <feDropShadow dx='-6' dy='6' stdDeviation='8' flood-color='#050d26' flood-opacity='0.28' />
    </filter>
  </defs>

  <!-- 'Convert' Wordmark -->
  <text x='160' y='275' font-family='system-ui, -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", sans-serif' font-size='220' font-weight='800' fill='#111827' letter-spacing='-4'>Convert</text>

  <!-- 'X' Arrow Logo Mark (Positioned directly after Convert) -->
  <g transform='translate(1085, 95) scale(0.42)'>
    <!-- 1. Background Stroke (rotated -45 deg around 256, 256) -->
    <rect x='198' y='46' width='116' height='420' rx='58' transform='rotate(-45 256 256)' fill='url(#gradBack)' />

    <!-- 2. Foreground Arrow Stroke (rotated +45 deg around 256, 256) -->
    <g transform='rotate(45 256 256)' filter='url(#overlapShadow)'>
      <path d='
        M 198 408
        C 198 440, 224 466, 256 466
        C 288 466, 314 440, 314 408
        L 314 200
        L 366 200
        C 378 200, 384 185, 376 177
        L 265 52
        C 260 46, 252 46, 247 52
        L 136 177
        C 128 185, 134 200, 146 200
        L 198 200
        Z
      ' fill='url(#gradFront)' />
    </g>
  </g>

  <!-- Tagline: Convert • Compress • Create -->
  <text x='200' y='400' font-family='system-ui, -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", sans-serif' font-size='56' font-weight='500' fill='#64748b' letter-spacing='18'>Convert  •  Compress  •  Create</text>
</svg>