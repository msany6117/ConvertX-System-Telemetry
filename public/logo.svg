<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' width='512' height='512'>
  <defs>
    <!-- Gradient for Top-Left to Bottom-Right Stroke -->
    <linearGradient id='gradBack' x1='15%' y1='15%' x2='85%' y2='85%'>
      <stop offset='0%' stop-color='#00d2ff' />
      <stop offset='45%' stop-color='#2563eb' />
      <stop offset='100%' stop-color='#7c3aed' />
    </linearGradient>

    <!-- Gradient for Bottom-Left to Top-Right Arrow Stroke -->
    <linearGradient id='gradFront' x1='15%' y1='85%' x2='85%' y2='15%'>
      <stop offset='0%' stop-color='#00d2ff' />
      <stop offset='42%' stop-color='#2563eb' />
      <stop offset='78%' stop-color='#6366f1' />
      <stop offset='100%' stop-color='#8b5cf6' />
    </linearGradient>

    <!-- Subtle drop shadow on the crossing point -->
    <filter id='overlapShadow' x='-20%' y='-20%' width='150%' height='150%'>
      <feDropShadow dx='-8' dy='8' stdDeviation='10' flood-color='#050d26' flood-opacity='0.28' />
    </filter>
  </defs>

  <!-- 1. Background Stroke: Top-Left to Bottom-Right (rotated -45 deg) -->
  <rect x='198' y='46' width='116' height='420' rx='58' transform='rotate(-45 256 256)' fill='url(#gradBack)' />

  <!-- 2. Foreground Arrow: Bottom-Left to Top-Right (rotated +45 deg) -->
  <g transform='rotate(45 256 256)' filter='url(#overlapShadow)'>
    <path d='
      M 198 408
      C 198 440, 224 466, 256 466
      C 288 466, 314 440, 314 408
      L 314 200
      L 366 200
      C 378 200, 384 185, 376 177
      L 265 52
      C 260 46, 252 46, 247 52
      L 136 177
      C 128 185, 134 200, 146 200
      L 198 200
      Z
    ' fill='url(#gradFront)' />
  </g>
</svg>